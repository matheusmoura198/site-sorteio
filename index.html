<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planilha do Sorteio</title>
<style>
:root{--bg:#06210f;--card:#0d3a1c;--ink:#fff;--mut:#9fd3ae;--gold:#ffc800;--line:#1c5a30;--ok:#2ecc71;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px 8px;border-bottom:2px solid var(--gold);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0 0 4px;font-size:18px;color:var(--gold)}
#st{font-size:12px;margin-bottom:6px;color:var(--mut)}
.stats{display:flex;gap:6px;font-size:12px;margin-bottom:8px}
.stats div{flex:1;background:var(--card);border-radius:8px;padding:6px;text-align:center}
.stats b{display:block;font-size:16px;color:var(--gold)}
.bar{display:flex;gap:6px}
input,button,textarea{font:inherit;color:var(--ink)}
.bar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px}
button{background:var(--gold);color:#222;border:0;border-radius:8px;padding:9px 12px;font-weight:700}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px}
.tabs button.on{background:var(--gold);color:#222}
main{padding:8px 8px 40px;max-width:720px;margin:0 auto}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
.row.sold{border-color:var(--ok)}
.row.hide{display:none}
.num{font-weight:800;font-size:17px;color:var(--gold);text-align:center}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%;background:#082a14;border:1px solid var(--line);border-radius:6px;padding:7px;font-size:15px}
.pay{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);gap:2px}
.pay input{width:22px;height:22px;accent-color:var(--ok)}
#empty{text-align:center;color:var(--mut);padding:24px;display:none}
dialog{background:var(--card);border:2px solid var(--gold);border-radius:12px;width:min(92vw,520px);padding:12px;color:var(--ink)}
dialog::backdrop{background:#000a}
textarea{width:100%;height:42vh;background:#082a14;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
p.h{font-size:12px;color:var(--mut);margin:0 0 6px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#login .box{width:100%;max-width:360px;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:18px}
#login h2{margin:0 0 4px;color:var(--gold)}
#login input{width:100%;margin-top:10px;background:#082a14;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:16px}
#login button{width:100%;margin-top:14px;padding:12px}
#lerr{color:#ff8b8b;font-size:13px;margin-top:10px;min-height:16px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <form class="box" id="lform">
    <h2>🍀 Sorteio R$ 1.000</h2>
    <p class="h">Entre para ver e editar a lista.</p>
    <input id="le" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div id="lerr"></div>
  </form>
</div>

<div id="app" class="hidden">
<header>
  <div class="top"><h1>🍀 Sorteio R$ 1.000 — 500 números</h1><button class="sec" id="out" style="padding:6px 10px">Sair</button></div>
  <div id="st">Conectando…</div>
  <div class="stats">
    <div><b id="sVend">0</b>Vendidos</div>
    <div><b id="sLivre">500</b>Livres</div>
    <div><b id="sPago">0</b>Pagos</div>
    <div><b id="sGrana">R$0</b>Arrecadado</div>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar número, nome ou contato">
    <button class="sec" id="bk">Backup</button>
  </div>
  <div class="tabs">
    <button class="on" data-f="all">Todos</button>
    <button data-f="sold">Vendidos</button>
    <button data-f="free">Livres</button>
    <button data-f="unpaid">Não pagos</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="empty">Nenhum número encontrado.</div>
</main>
</div>

<dialog id="dlg">
  <p class="h">Backup: copie o texto e guarde. Para restaurar, cole aqui e toque em Importar.</p>
  <textarea id="ta"></textarea>
  <div class="acts">
    <button id="cp">Copiar</button>
    <button id="im" class="sec">Importar</button>
    <button id="cl" class="sec">Fechar</button>
  </div>
  <p class="h" id="msg" style="margin-top:8px"></p>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtoQK-Gw8Xe5cP46VbQe9iIQ0HTkQwzCM",
  authDomain: "site-sorteio-11b54.firebaseapp.com",
  projectId: "site-sorteio-11b54",
  storageBucket: "site-sorteio-11b54.firebasestorage.app",
  messagingSenderId: "992012996208",
  appId: "1:992012996208:web:d3e8f2128cdf7ca386eeb5"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), fs=getFirestore(app);
const $=id=>document.getElementById(id);
const PRECO=5, N=500, COL='numeros';
const data=[]; for(let i=0;i<N;i++) data.push({n:'',c:'',p:0});
const timers={};
let unsub=null, built=false;
const pad=i=>String(i+1).padStart(3,'0');
const sold=d=>!!(d.n.trim()||d.c.trim());

function setStatus(t){
  const m={ok:['🟢 Salvo na nuvem','#2ecc71'],sync:['🔄 Salvando…','#ffc800'],err:['🔴 Erro ao salvar — verifique a internet','#ff6b6b']}[t];
  $('st').textContent=m[0]; $('st').style.color=m[1];
}

// ---------- login ----------
$('lform').addEventListener('submit',async e=>{
  e.preventDefault(); $('lerr').textContent='Entrando…';
  try{ await signInWithEmailAndPassword(auth,$('le').value.trim(),$('lp').value); $('lerr').textContent=''; }
  catch(err){
    const c=err.code||'';
    $('lerr').textContent=(c.includes('invalid')||c.includes('wrong')||c.includes('user-not-found'))?'E-mail ou senha incorretos.':(c.includes('network')?'Sem conexão com a internet.':'Não foi possível entrar ('+c+').');
  }
});
$('out').addEventListener('click',()=>signOut(auth));

onAuthStateChanged(auth,user=>{
  if(user){
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    build(); listen();
  }else{
    if(unsub){unsub();unsub=null;}
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  }
});

// ---------- lista ----------
let rows;
function build(){
  if(built)return; built=true;
  let h='';
  for(let i=0;i<N;i++) h+='<div class="row" data-i="'+i+'"><div class="num">'+pad(i)+'</div><div class="f"><input data-k="n" placeholder="Nome" autocomplete="off"><input data-k="c" placeholder="Contato (WhatsApp)" inputmode="tel" autocomplete="off"></div><label class="pay"><input type="checkbox" data-k="p">Pago</label></div>';
  $('list').innerHTML=h; rows=$('list').children;
  $('list').addEventListener('input',e=>{
    const t=e.target, r=t.closest('.row'); if(!r)return;
    const i=+r.dataset.i, k=t.dataset.k;
    if(k==='p')data[i].p=t.checked?1:0; else data[i][k]=t.value;
    save(i); apply();
  });
  apply();
}
let filter='all', query='';
function apply(){
  let v=0,pg=0,shown=0; const q=query.toLowerCase();
  for(let i=0;i<N;i++){
    const d=data[i], s=sold(d); if(s)v++; if(s&&d.p)pg++;
    let ok=true;
    if(filter==='sold')ok=s; else if(filter==='free')ok=!s; else if(filter==='unpaid')ok=s&&!d.p;
    if(ok&&q)ok=(pad(i)+' '+d.n+' '+d.c).toLowerCase().indexOf(q)>-1;
    rows[i].classList.toggle('hide',!ok); rows[i].classList.toggle('sold',s);
    if(ok)shown++;
  }
  $('sVend').textContent=v; $('sLivre').textContent=N-v; $('sPago').textContent=pg; $('sGrana').textContent='R$'+(pg*PRECO);
  $('empty').style.display=shown?'none':'block';
}
$('q').addEventListener('input',e=>{query=e.target.value.trim();if(built)apply();});
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  filter=b.dataset.f;
  [...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));
  apply();
});

// ---------- Firestore ----------
function save(i){
  setStatus('sync'); clearTimeout(timers[i]);
  timers[i]=setTimeout(()=>{delete timers[i];persist(i);},500);
}
function persist(i){
  const d=data[i], ref=doc(fs,COL,pad(i));
  const p=(sold(d)||d.p)?setDoc(ref,{n:d.n,c:d.c,p:d.p?1:0}):deleteDoc(ref);
  p.then(()=>{if(!Object.keys(timers).length)setStatus('ok');}).catch(()=>setStatus('err'));
}
function listen(){
  if(unsub)return;
  unsub=onSnapshot(collection(fs,COL),snap=>{
    const remote={}; snap.forEach(x=>remote[x.id]=x.data());
    for(let i=0;i<N;i++){
      if(timers[i])continue;
      const r=remote[pad(i)]||{n:'',c:'',p:0};
      const ins=rows[i].querySelectorAll('input');
      if(document.activeElement===ins[0]||document.activeElement===ins[1])continue;
      data[i]={n:r.n||'',c:r.c||'',p:r.p?1:0};
      if(ins[0].value!==data[i].n)ins[0].value=data[i].n;
      if(ins[1].value!==data[i].c)ins[1].value=data[i].c;
      ins[2].checked=!!data[i].p;
    }
    apply();
    if(!Object.keys(timers).length)setStatus('ok');
  },()=>setStatus('err'));
}

// ---------- Backup ----------
const dlg=$('dlg'), ta=$('ta'), msg=$('msg');
const qt=s=>'"'+String(s).replace(/"/g,'""')+'"';
function toCSV(){
  const out=['numero;nome;contato;pago'];
  for(let i=0;i<N;i++){const d=data[i]; if(sold(d)||d.p) out.push(pad(i)+';'+qt(d.n)+';'+qt(d.c)+';'+(d.p?'sim':'nao'));}
  return out.join('\n');
}
function parseLine(l){
  const res=[]; let cur='',inq=false;
  for(let j=0;j<l.length;j++){
    const ch=l[j];
    if(inq){ if(ch==='"'){ if(l[j+1]==='"'){cur+='"';j++;} else inq=false;} else cur+=ch; }
    else if(ch==='"')inq=true; else if(ch===';'){res.push(cur);cur='';} else cur+=ch;
  }
  res.push(cur); return res;
}
$('bk').onclick=()=>{ta.value=toCSV();msg.textContent='';dlg.showModal();};
$('cl').onclick=()=>dlg.close();
$('cp').onclick=()=>{ta.select();try{navigator.clipboard.writeText(ta.value);msg.textContent='Copiado!';}catch(e){msg.textContent='Selecione o texto e copie manualmente.';}};
$('im').onclick=()=>{
  let cnt=0;
  ta.value.split(/\r?\n/).forEach(line=>{
    const p=parseLine(line), num=parseInt(p[0],10);
    if(!(num>=1&&num<=N))return;
    const x=num-1;
    data[x]={n:(p[1]||'').trim(),c:(p[2]||'').trim(),p:/^(sim|1|s)$/i.test((p[3]||'').trim())?1:0};
    const ins=rows[x].querySelectorAll('input'); ins[0].value=data[x].n; ins[1].value=data[x].c; ins[2].checked=!!data[x].p;
    cnt++; save(x);
  });
  apply(); msg.textContent=cnt+' número(s) importado(s).';
};
</script>
</body>
</html>
