<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planilha do Sorteio</title>
<style>
:root{--bg:#06210f;--card:#0d3a1c;--ink:#fff;--mut:#9fd3ae;--gold:#ffc800;--line:#1c5a30;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px 8px;border-bottom:2px solid var(--gold);z-index:5}
h1{margin:0 0 6px;font-size:18px;color:var(--gold)}
.stats{display:flex;gap:6px;font-size:12px;margin-bottom:8px}
.stats div{flex:1;background:var(--card);border-radius:8px;padding:6px;text-align:center}
.stats b{display:block;font-size:16px;color:var(--gold)}
.bar{display:flex;gap:6px}
input,button,textarea{font:inherit;color:var(--ink)}
.bar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px}
button{background:var(--gold);color:#222;border:0;border-radius:8px;padding:9px 12px;font-weight:700}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px}
.tabs button.on{background:var(--gold);color:#222}
main{padding:8px 8px 40px;max-width:720px;margin:0 auto}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
.row.sold{border-color:var(--ok)}
.row.hide{display:none}
.num{font-weight:800;font-size:17px;color:var(--gold);text-align:center}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%;background:#082a14;border:1px solid var(--line);border-radius:6px;padding:7px;font-size:15px}
.pay{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);gap:2px}
.pay input{width:22px;height:22px;accent-color:var(--ok)}
#empty{text-align:center;color:var(--mut);padding:24px;display:none}
dialog{background:var(--card);border:2px solid var(--gold);border-radius:12px;width:min(92vw,520px);padding:12px}
dialog::backdrop{background:#000a}
textarea{width:100%;height:42vh;background:#082a14;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
p.h{font-size:12px;color:var(--mut);margin:0 0 6px}
</style>
</head>
<body>
<header>
  <h1>🍀 Sorteio R$ 1.000 — 500 números</h1>
  <div id="st" style="font-size:12px;margin:-2px 0 6px;color:#9fd3ae">Conectando…</div>
  <div class="stats">
    <div><b id="sVend">0</b>Vendidos</div>
    <div><b id="sLivre">500</b>Livres</div>
    <div><b id="sPago">0</b>Pagos</div>
    <div><b id="sGrana">R$0</b>Arrecadado</div>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar número, nome ou contato">
    <button class="sec" id="bk">Backup</button>
  </div>
  <div class="tabs">
    <button class="on" data-f="all">Todos</button>
    <button data-f="sold">Vendidos</button>
    <button data-f="free">Livres</button>
    <button data-f="unpaid">Não pagos</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="empty">Nenhum número encontrado.</div>
</main>

<dialog id="dlg">
  <p class="h">Backup: copie o texto e guarde (ex.: no WhatsApp). Para restaurar ou passar para outro celular, cole aqui e toque em Importar.</p>
  <textarea id="ta"></textarea>
  <div class="acts">
    <button id="cp">Copiar</button>
    <button id="im" class="sec">Importar</button>
    <button id="cl" class="sec">Fechar</button>
  </div>
  <p class="h" id="msg" style="margin-top:8px"></p>
</dialog>

<script>
(function(){
  var KEY='sorteio500_v1', PRECO=5, N=500;
  var data=[];
  for(var i=0;i<N;i++) data.push({n:'',c:'',p:0});
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw); if(Array.isArray(s)) for(var i=0;i<N&&i<s.length;i++) if(s[i]) data[i]={n:s[i].n||'',c:s[i].c||'',p:s[i].p?1:0};}
  }catch(e){}
  var timers={}, db=null, localHad=false;
  for(var i=0;i<N;i++) if(data[i].n||data[i].c||data[i].p) localHad=true;
  function setStatus(t){
    var el=document.getElementById('st');
    var m={ok:['🟢 Salvo na nuvem','#2ecc71'],sync:['🔄 Sincronizando…','#ffc800'],off:['🟠 Só neste aparelho (nuvem indisponível)','#ffa94d'],err:['🔴 Erro ao salvar — tente de novo','#ff6b6b'],ro:['👀 Somente leitura (sem permissão para editar)','#ffa94d']}[t];
    el.textContent=m[0]; el.style.color=m[1];
  }
  function save(i){
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
    if(!db){return;}
    setStatus('sync');
    clearTimeout(timers[i]);
    timers[i]=setTimeout(function(){delete timers[i];persist(i);},500);
  }
  function persist(i){
    if(!db)return;
    var d=data[i], ref=db.collection('numeros').doc(pad(i));
    var pr=(sold(d)||d.p)?ref.set({n:d.n,c:d.c,p:d.p?1:0}):ref.delete();
    pr.then(function(){if(!Object.keys(timers).length)setStatus('ok');}).catch(function(e){setStatus(e&&e.code==='invalid_argument'?'ro':'err');});
  }
  function pad(i){return String(i+1).padStart(3,'0');}
  var list=document.getElementById('list'), html='';
  for(var i=0;i<N;i++){
    html+='<div class="row" data-i="'+i+'"><div class="num">'+pad(i)+'</div><div class="f"><input data-k="n" placeholder="Nome" autocomplete="off"><input data-k="c" placeholder="Contato (WhatsApp)" inputmode="tel" autocomplete="off"></div><label class="pay"><input type="checkbox" data-k="p">Pago</label></div>';
  }
  list.innerHTML=html;
  var rows=list.children;
  for(var i=0;i<N;i++){
    var r=rows[i], ins=r.querySelectorAll('input');
    ins[0].value=data[i].n; ins[1].value=data[i].c; ins[2].checked=!!data[i].p;
  }
  var filter='all', query='';
  function sold(d){return !!(d.n.trim()||d.c.trim());}
  function apply(){
    var v=0,pg=0,shown=0,q=query.toLowerCase();
    for(var i=0;i<N;i++){
      var d=data[i], s=sold(d); if(s)v++; if(s&&d.p)pg++;
      var ok=true;
      if(filter==='sold')ok=s; else if(filter==='free')ok=!s; else if(filter==='unpaid')ok=s&&!d.p;
      if(ok&&q){ok=(pad(i)+' '+d.n+' '+d.c).toLowerCase().indexOf(q)>-1;}
      rows[i].classList.toggle('hide',!ok);
      rows[i].classList.toggle('sold',s);
      if(ok)shown++;
    }
    document.getElementById('sVend').textContent=v;
    document.getElementById('sLivre').textContent=N-v;
    document.getElementById('sPago').textContent=pg;
    document.getElementById('sGrana').textContent='R$'+(pg*PRECO);
    document.getElementById('empty').style.display=shown?'none':'block';
  }
  list.addEventListener('input',function(e){
    var t=e.target, r=t.closest('.row'); if(!r)return;
    var i=+r.dataset.i, k=t.dataset.k;
    if(k==='p')data[i].p=t.checked?1:0; else data[i][k]=t.value;
    save(i); apply();
  });
  document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim();apply();});
  document.querySelector('.tabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    filter=b.dataset.f;
    Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
    apply();
  });
  // Backup (CSV com ;)
  var dlg=document.getElementById('dlg'), ta=document.getElementById('ta'), msg=document.getElementById('msg');
  function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}
  function toCSV(){
    var out=['numero;nome;contato;pago'];
    for(var i=0;i<N;i++){var d=data[i]; if(sold(d)||d.p) out.push(pad(i)+';'+q(d.n)+';'+q(d.c)+';'+(d.p?'sim':'nao'));}
    return out.join('\n');
  }
  function parseLine(l){
    var res=[],cur='',inq=false;
    for(var j=0;j<l.length;j++){
      var ch=l[j];
      if(inq){ if(ch==='"'){ if(l[j+1]==='"'){cur+='"';j++;} else inq=false;} else cur+=ch; }
      else if(ch==='"')inq=true; else if(ch===';'){res.push(cur);cur='';} else cur+=ch;
    }
    res.push(cur); return res;
  }
  document.getElementById('bk').onclick=function(){ta.value=toCSV();msg.textContent='';if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');};
  document.getElementById('cl').onclick=function(){dlg.close?dlg.close():dlg.removeAttribute('open');};
  document.getElementById('cp').onclick=function(){
    ta.select();
    try{ if(navigator.clipboard) navigator.clipboard.writeText(ta.value); else document.execCommand('copy'); msg.textContent='Copiado!'; }catch(e){ msg.textContent='Selecione o texto e copie manualmente.'; }
  };
  document.getElementById('im').onclick=function(){
    var lines=ta.value.split(/\r?\n/), cnt=0;
    for(var i=0;i<lines.length;i++){
      var p=parseLine(lines[i]), num=parseInt(p[0],10);
      if(!(num>=1&&num<=N))continue;
      var x=num-1;
      data[x]={n:(p[1]||'').trim(),c:(p[2]||'').trim(),p:/^(sim|1|s)$/i.test((p[3]||'').trim())?1:0};
      var ins=rows[x].querySelectorAll('input'); ins[0].value=data[x].n; ins[1].value=data[x].c; ins[2].checked=!!data[x].p;
      cnt++; save(x);
    }
    apply(); msg.textContent=cnt+' número(s) importado(s).';
  };
  function startDb(){
    if(!window.claude||!claude.use){setStatus('off');return;}
    claude.use('db').then(function(d){
      if(!d){setStatus('off');return;}
      db=d; var first=true;
      db.collection('numeros').onSnapshot(function(snap){
        var remote={};
        snap.docs.forEach(function(x){remote[x.id]=x.data();});
        if(first&&snap.empty&&localHad){
          first=false; setStatus('sync');
          for(var i=0;i<N;i++) if(sold(data[i])||data[i].p) persist(i);
          return;
        }
        first=false;
        for(var i=0;i<N;i++){
          if(timers[i])continue;
          var r=remote[pad(i)]||{n:'',c:'',p:0};
          var ins=rows[i].querySelectorAll('input');
          if(document.activeElement===ins[0]||document.activeElement===ins[1])continue;
          data[i]={n:r.n||'',c:r.c||'',p:r.p?1:0};
          if(ins[0].value!==data[i].n)ins[0].value=data[i].n;
          if(ins[1].value!==data[i].c)ins[1].value=data[i].c;
          ins[2].checked=!!data[i].p;
        }
        try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
        apply();
        if(!Object.keys(timers).length)setStatus('ok');
      },function(){setStatus('err');});
    }).catch(function(){setStatus('off');});
  }
  apply();
  startDb();
})();
</script>
</body>
</html>
